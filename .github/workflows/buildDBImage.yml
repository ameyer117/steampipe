name: Build and Publish DB Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: |
          Version number for the OCI image for this release - usually the same as the
          postgres version
        required: true
        default: 14.19.0

      postgres_version:
        description: "Postgres Version to package (eg 14.19.0)"
        required: true
        default: 14.19.0

env:
  PROJECT_ID: steampipe
  IMAGE_NAME: db
  CORE_REPO: ghcr.io/${{ github.repository_owner }}/steampipe
  ORG: turbot
  CONFIG_SCHEMA_VERSION: "2020-11-18"
  VERSION: ${{ github.event.inputs.version }}
  PG_VERSION: ${{ github.event.inputs.postgres_version }}
  PATH_BASE: https://repo1.maven.org/maven2/io/zonky/test/postgres
  NAME_PREFIX: embedded-postgres-binaries
  STEAMPIPE_UPDATE_CHECK: false
  ORAS_VERSION: 1.1.0

jobs:
  build:
    name: Build and Publish DB Image
    runs-on: ubuntu-latest

    steps:
      - name: Trim asset version prefix and Validate
        run: |-
          echo "$VERSION"
          trim=${VERSION#"v"}
          echo "$trim"
          if [[ $trim =~  ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "Version OK: $trim"
          else
            echo "Invalid version: $trim"
            exit 1
          fi
          echo "VERSION=${trim}" >> "$GITHUB_ENV"

      - name: Ensure Version Does Not Exist
        run: |-
          URL=https://$(echo "$CORE_REPO" | sed 's/\//\/v2\//')/"$IMAGE_NAME"/tags/list
          IDX=$(curl -Ls "$URL" | jq ".tags | index(\"$VERSION\")")
          if [ "$IDX" == "null" ]; then
            echo "OK - Version does not exist: $VERSION"
          else
            echo "Version already exists: $VERSION"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # Login to GHCR
      - name: Log in to the Container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Darwin AMD64 from Zonky
      - name: Pull & Extract - darwin amd64 (from Zonky)
        run: |-
          EXTRACT_DIR=extracted-darwin-amd64
          mkdir "$EXTRACT_DIR"

          ARTIFACT_ID="${NAME_PREFIX}-darwin-amd64"
          JAR_NAME="${ARTIFACT_ID}-${PG_VERSION}.jar"
          JAR_URL="${PATH_BASE}/${ARTIFACT_ID}/${PG_VERSION}/${JAR_NAME}"

          echo "Downloading ${JAR_URL}"
          curl -L -o "${JAR_NAME}" "${JAR_URL}"

          mkdir -p tmp-darwin-amd64
          unzip -j "${JAR_NAME}" '*.txz' -d tmp-darwin-amd64

          TXZ_FILE=$(ls tmp-darwin-amd64/*.txz)
          echo "Using archive ${TXZ_FILE}"

          tar -xf "${TXZ_FILE}" --directory "${EXTRACT_DIR}"

      # Darwin ARM64 from Zonky
      - name: Pull & Extract - darwin arm64 (from Zonky)
        run: |-
          EXTRACT_DIR=extracted-darwin-arm64
          mkdir "$EXTRACT_DIR"

          ARTIFACT_ID="${NAME_PREFIX}-darwin-arm64v8"
          JAR_NAME="${ARTIFACT_ID}-${PG_VERSION}.jar"
          JAR_URL="${PATH_BASE}/${ARTIFACT_ID}/${PG_VERSION}/${JAR_NAME}"

          echo "Downloading ${JAR_URL}"
          curl -L -o "${JAR_NAME}" "${JAR_URL}"

          mkdir -p tmp-darwin-arm64
          unzip -j "${JAR_NAME}" '*.txz' -d tmp-darwin-arm64

          TXZ_FILE=$(ls tmp-darwin-arm64/*.txz)
          echo "Using archive ${TXZ_FILE}"

          tar -xf "${TXZ_FILE}" --directory "${EXTRACT_DIR}"

      # Linux AMD64 from Zonky
      - name: Pull & Extract - linux amd64 (from Zonky)
        run: |-
          EXTRACT_DIR=extracted-linux-amd64
          mkdir "$EXTRACT_DIR"

          ARTIFACT_ID="${NAME_PREFIX}-linux-amd64"
          JAR_NAME="${ARTIFACT_ID}-${PG_VERSION}.jar"
          JAR_URL="${PATH_BASE}/${ARTIFACT_ID}/${PG_VERSION}/${JAR_NAME}"

          echo "Downloading ${JAR_URL}"
          curl -L -o "${JAR_NAME}" "${JAR_URL}"

          mkdir -p tmp-linux-amd64
          unzip -j "${JAR_NAME}" '*.txz' -d tmp-linux-amd64

          TXZ_FILE=$(ls tmp-linux-amd64/*.txz)
          echo "Using archive ${TXZ_FILE}"

          tar -xf "${TXZ_FILE}" --directory "${EXTRACT_DIR}"

      # Linux ARM64 from Zonky
      - name: Pull & Extract - linux arm64 (from Zonky)
        run: |-
          EXTRACT_DIR=extracted-linux-arm64
          mkdir "$EXTRACT_DIR"

          ARTIFACT_ID="${NAME_PREFIX}-linux-arm64v8"
          JAR_NAME="${ARTIFACT_ID}-${PG_VERSION}.jar"
          JAR_URL="${PATH_BASE}/${ARTIFACT_ID}/${PG_VERSION}/${JAR_NAME}"

          echo "Downloading ${JAR_URL}"
          curl -L -o "${JAR_NAME}" "${JAR_URL}"

          mkdir -p tmp-linux-arm64
          unzip -j "${JAR_NAME}" '*.txz' -d tmp-linux-arm64

          TXZ_FILE=$(ls tmp-linux-arm64/*.txz)
          echo "Using archive ${TXZ_FILE}"

          tar -xf "${TXZ_FILE}" --directory "${EXTRACT_DIR}"

      - name: Build Config JSON
        run: |-
          JSON_STRING=$( jq -n \
            --arg name "$IMAGE_NAME" \
            --arg organization "$ORG" \
            --arg version "$VERSION" \
            --arg schemaVersion "$CONFIG_SCHEMA_VERSION" \
            --arg dbVersion "$PG_VERSION" \
            '{schemaVersion: $schemaVersion, db: { name: $name, organization: $organization, version: $version, dbVersion: $dbVersion} }' )

          echo "$JSON_STRING" > config.json

      - name: Build Annotations JSON
        run: |-
          JSON_STRING=$( jq -n \
              --arg title "$IMAGE_NAME" \
              --arg desc "$ORG" \
              --arg version "$VERSION" \
              --arg timestamp "$(date +%FT%TZ)" \
              --arg vendor "Turbot HQ, Inc." \
            '{ 
                "$manifest": { 
                    "org.opencontainers.image.title": $title, 
                    "org.opencontainers.image.description": $desc,
                    "org.opencontainers.image.version": $version, 
                    "org.opencontainers.image.created": $timestamp,
                    "org.opencontainers.image.vendor":  $vendor
                }
            }' )

          echo "$JSON_STRING" > annotations.json

      - name: Install specific version of ORAS
        run: |
          curl -LO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          sudo tar xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" -C /usr/local/bin oras
          oras version

      - name: Push to Registry
        run: |-
          REF="$CORE_REPO/$IMAGE_NAME:$VERSION"

          oras push "$REF" \
              --config config.json:application/vnd.turbot.steampipe.config.v1+json \
              --annotation-file annotations.json \
              extracted-darwin-amd64:application/vnd.turbot.steampipe.db.darwin-amd64.layer.v1+tar \
              extracted-darwin-arm64:application/vnd.turbot.steampipe.db.darwin-arm64.layer.v1+tar \
              extracted-linux-amd64:application/vnd.turbot.steampipe.db.linux-amd64.layer.v1+tar \
              extracted-linux-arm64:application/vnd.turbot.steampipe.db.linux-arm64.layer.v1+tar
